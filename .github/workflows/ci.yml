name: framework-ci
on:
  push:
    branches: [main, 'framework/**']
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test portable C++ contracts
        run: bash scripts/test_core.sh
  ros2:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    env:
      ROS_DOMAIN_ID: '42'
      ROS_LOCALHOST_ONLY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install workspace dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep ros-jazzy-behaviortree-cpp
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y
      - name: Build ROS 2 packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+ --cmake-args -DBUILD_TESTING=ON
      - name: Run core and ROS action integration tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose
          python3 scripts/test_ros.py
