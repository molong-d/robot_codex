controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    panda_hand_controller:
      type: parallel_gripper_action_controller/GripperActionController

panda_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.001
      panda_joint1: {goal: 0.001}
      panda_joint2: {goal: 0.001}
      panda_joint3: {goal: 0.001}
      panda_joint4: {goal: 0.001}
      panda_joint5: {goal: 0.001}
      panda_joint6: {goal: 0.001}
      panda_joint7: {goal: 0.001}

panda_hand_controller:
  ros__parameters:
    use_sim_time: true
    joint: panda_finger_joint1
    state_interfaces: [position, velocity]
    goal_tolerance: 0.001
    allow_stalling: true
